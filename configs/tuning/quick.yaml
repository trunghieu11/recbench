# Search spaces for the quick-tier bake-off (read by recbench.tuning; format in src/recbench/tuning/spaces.py).
# Every method gets the same number of trials (configs/benchmarks/quick.yaml: tuning.trials), so the
# comparison is fair. Ranges follow published tuning recipes; the source is noted per method.
# `confirm` names the setting that depends on data size; it is re-checked when a winner moves to full data.
version: 1

# Added to every method unless it says `common: false`.
common:
  # Train only on the last N days before the cutoff (null = all history). Each user keeps their last
  # 10 events, so nobody's profile disappears.
  train_window_days: {type: choice, values: [null, 30, 90, 365]}

methods:
  random:
    trials: 1          # nothing to tune; one run is the anchor
    common: false

  most_popular:        # the window and decay ARE its settings
    common: false
    params:
      pop_window_days: {type: choice, values: [3, 7, 14, 28, 56, 112, 365]}
      pop_half_life_days: {type: choice, values: [null, 3, 7, 14, 30]}

  itemknn:             # Ferrari Dacrema et al. 2019 (neighbours, shrink, feature weighting)
    params:
      knn_neighbors: {type: logint, low: 10, high: 1000}
      knn_shrink: {type: choice, values: [0, 10, 50, 100, 500]}
      knn_weighting: {type: choice, values: [none, tfidf, bm25]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  ease:                # Steck 2019: lambda is the only model setting
    params:
      ease_lambda: {type: log, low: 1.0, high: 20000.0}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}
    confirm: {param: ease_lambda, factors: [0.5, 1.0, 2.0], scale_with: users}

  ials:                # Rendle et al. 2022 (factors, regularisation, unobserved weight via alpha)
    params:
      dim: {type: choice, values: [64, 128, 256, 512]}
      ials_reg: {type: log, low: 0.001, high: 100.0}
      ials_alpha: {type: log, low: 0.3, high: 100.0}
      ials_iterations: {type: choice, values: [10, 20]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}
    confirm: {param: ials_reg, factors: [0.5, 1.0, 2.0], scale_with: users}

  bpr_mf:              # Rendle et al. 2009; implicit's SGD settings
    params:
      dim: {type: choice, values: [64, 128, 256]}
      bpr_lr: {type: log, low: 0.001, high: 0.1}
      bpr_reg: {type: log, low: 0.00001, high: 0.1}
      bpr_iterations: {type: choice, values: [50, 100, 200]}

  sasrec:              # Kang & McAuley 2018; Klenitskiy & Vasilev 2023 (loss); early stopping on the fold
    params:
      sasrec_loss: {type: choice, values: [auto, sampled, bce]}
      n_negatives: {type: choice, values: [256, 1024, 4096]}
      lr: {type: log, low: 0.0001, high: 0.01}
      dropout: {type: choice, values: [0.1, 0.2, 0.3, 0.5]}
      dim: {type: choice, values: [64, 128]}
      seq_len: {type: choice, values: [50, 100, 200]}
