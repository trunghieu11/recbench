# Search spaces for the quick-tier bake-off (read by recbench.tuning; format in src/recbench/tuning/spaces.py).
# Every method gets the same number of trials (configs/benchmarks/quick.yaml: tuning.trials), so the
# comparison is fair. Ranges follow published tuning recipes; the source is noted per method.
# `confirm` names the setting that depends on data size; it is re-checked when a winner moves to full data.
version: 1

# Added to every method unless it says `common: false`.
common:
  # Train only on the last N days before the cutoff (null = all history). Each user keeps their last
  # 10 events, so nobody's profile disappears.
  train_window_days: {type: choice, values: [null, 30, 90, 365]}

methods:
  random:
    trials: 1          # nothing to tune; one run is the anchor
    common: false

  most_popular:        # the window and decay ARE its settings
    common: false
    params:
      pop_window_days: {type: choice, values: [3, 7, 14, 28, 56, 112, 365]}
      pop_half_life_days: {type: choice, values: [null, 3, 7, 14, 30]}

  itemknn:             # Ferrari Dacrema et al. 2019 (neighbours, shrink, feature weighting)
    params:
      knn_neighbors: {type: logint, low: 10, high: 1000}
      knn_shrink: {type: choice, values: [0, 10, 50, 100, 500]}
      knn_weighting: {type: choice, values: [none, tfidf, bm25]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  ease:                # Steck 2019: lambda is the only model setting
    params:
      ease_lambda: {type: log, low: 1.0, high: 20000.0}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}
    confirm: {param: ease_lambda, factors: [0.5, 1.0, 2.0], scale_with: users}

  ials:                # Rendle et al. 2022 (factors, regularisation, unobserved weight via alpha)
    params:
      dim: {type: choice, values: [64, 128, 256, 512]}
      ials_reg: {type: log, low: 0.001, high: 100.0}
      ials_alpha: {type: log, low: 0.3, high: 100.0}
      ials_iterations: {type: choice, values: [10, 20]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}
    confirm: {param: ials_reg, factors: [0.5, 1.0, 2.0], scale_with: users}

  bpr_mf:              # Rendle et al. 2009; implicit's SGD settings
    params:
      dim: {type: choice, values: [64, 128, 256]}
      bpr_lr: {type: log, low: 0.001, high: 0.1}
      bpr_reg: {type: log, low: 0.00001, high: 0.1}
      bpr_iterations: {type: choice, values: [50, 100, 200]}

  sasrec:              # Kang & McAuley 2018; Klenitskiy & Vasilev 2023 (loss); early stopping on the fold
    params:
      sasrec_loss: {type: choice, values: [auto, sampled, bce]}
      n_negatives: {type: choice, values: [256, 1024, 4096]}
      lr: {type: log, low: 0.0001, high: 0.01}
      dropout: {type: choice, values: [0.1, 0.2, 0.3, 0.5]}
      dim: {type: choice, values: [64, 128]}
      seq_len: {type: choice, values: [50, 100, 200]}

  rp3beta:             # Paudel et al. 2016; Ferrari Dacrema et al. 2019 (alpha, beta, neighbours)
    params:
      rp3_alpha: {type: float, low: 0.3, high: 2.0}
      rp3_beta: {type: float, low: 0.0, high: 1.0}
      rp3_neighbors: {type: logint, low: 20, high: 1000}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  puresvd:             # Cremonesi et al. 2010: the number of factors is the only setting
    params:
      svd_factors: {type: choice, values: [16, 32, 64, 128, 256, 512, 1024]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  slim:                # Ning & Karypis 2011 (fsSLIM); Ferrari Dacrema et al. 2019 ranges
    params:
      slim_alpha: {type: log, low: 0.00001, high: 0.1}
      slim_l1_ratio: {type: log, low: 0.01, high: 1.0}
      slim_neighbors: {type: choice, values: [50, 100, 200]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  vsknn:               # Ludewig & Jannach 2018 (session-rec VSKNN)
    params:
      vsknn_k: {type: choice, values: [50, 100, 200, 500]}
      vsknn_sample: {type: choice, values: [500, 1000, 5000]}
      vsknn_weighting: {type: choice, values: [div, linear, same]}
      vsknn_last_n: {type: choice, values: [null, 10, 50]}
      vsknn_idf: {type: choice, values: [true, false]}

  sansa:               # Spisak et al. 2023 (lambda as EASE, density of the sparse weights)
    params:
      sansa_lambda: {type: log, low: 1.0, high: 20000.0}
      sansa_density: {type: log, low: 0.00001, high: 0.01}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}
    confirm: {param: sansa_lambda, factors: [0.5, 1.0, 2.0], scale_with: users}

  gfcf:                # Shen et al. 2021 (alpha = 0.3, k = 256 in the paper)
    params:
      gfcf_alpha: {type: float, low: 0.0, high: 1.0}
      gfcf_k: {type: choice, values: [64, 128, 256, 512, 1024]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  turbocf:             # Park et al. 2024 (normalisation, element-wise power, filter shape)
    params:
      turbocf_alpha: {type: float, low: 0.3, high: 0.7}
      turbocf_power: {type: float, low: 0.5, high: 1.5}
      turbocf_filter: {type: choice, values: [1, 2, 3]}
      decay_half_life_days: {type: choice, values: [null, 30, 90, 365]}

  simplex:             # Mao et al. 2021; RecZoo SimpleX configs (CCL margin, negatives, weight, gamma)
    params:
      simplex_negatives: {type: choice, values: [50, 100, 200, 500, 1000]}
      simplex_margin: {type: float, low: 0.2, high: 0.9}
      simplex_neg_weight: {type: log, low: 1.0, high: 500.0}
      simplex_gamma: {type: float, low: 0.0, high: 1.0}
      lr: {type: log, low: 0.0001, high: 0.01}
      dim: {type: choice, values: [64, 128]}

  directau:            # Wang et al. 2022 (the authors' grid for gamma and weight decay)
    params:
      directau_gamma: {type: choice, values: [0.01, 0.1, 0.2, 0.5, 1, 2, 5, 10]}
      directau_l2: {type: choice, values: [0.0, 1.0e-8, 1.0e-6, 1.0e-4]}
      batch_size: {type: choice, values: [256, 512, 1024, 2048]}
      lr: {type: log, low: 0.0001, high: 0.01}
      dim: {type: choice, values: [64, 128]}

  ultragcn:            # Mao et al. 2021; RecZoo configs (negatives = negative weight in the paper)
    params:
      ultragcn_negatives: {type: choice, values: [50, 100, 200, 500]}
      ultragcn_neg_weight: {type: choice, values: [10, 50, 100, 200, 500]}
      ultragcn_gamma: {type: log, low: 0.00001, high: 0.001}
      ultragcn_lambda: {type: log, low: 0.0001, high: 0.01}
      ultragcn_neighbors: {type: choice, values: [5, 10, 20]}
      lr: {type: log, low: 0.0001, high: 0.01}
