# Local stack:  docker compose -f deploy/compose.yaml up --build
#   api     http://localhost:8080  (serves data/bundles; dashboard needs MLflow, so use the venv for that)
#   mlflow  http://localhost:5001  (read-only view of runs/mlflow)
services:
  api:
    build:
      context: ..
    ports:
      - "8080:8080"
    environment:
      RECBENCH_BUNDLES: /bundles
      RECBENCH_TIER: ${RECBENCH_TIER:-smoke}
    volumes:
      - ../data/bundles:/bundles:ro
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    command: mlflow ui --host 0.0.0.0 --port 5001 --backend-store-uri file:///mlruns
    ports:
      - "5001:5001"
    volumes:
      - ../runs/mlflow:/mlruns:ro
