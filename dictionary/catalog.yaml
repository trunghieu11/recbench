# Single source of truth for facts shown in the docs (docs/generated/ is built from this file).
#
# rubric: five 1-5 scores, each with a one-line reason. Directions:
#   implementation, tuning, data_hunger  -> higher = MORE work / MORE data needed (worse)
#   controllability, explainability      -> higher = BETTER
# Anchors for every level are defined in docs/dictionary/metrics/qualitative-rubric.md.
# fidelity: faithful = follows the paper/canonical code; simplified = same core idea, smaller or
# partial (the method page explains the gap); placeholder = stands in for a family not implemented.

ladder:
  0: Baselines
  1: Neighbourhood and linear models
  2: Matrix factorisation
  3: Graph neural networks
  4: Sequential models
  5: CTR-style rankers
  6: Content and multimodal towers
  7: Managed services

methods:
  random:
    title: Random
    family: Baseline
    rung: 0
    year: null
    paper: null
    code: null
    fidelity: faithful
    summary: Scores every item at random. The floor every other method must beat.
    rubric:
      implementation: [1, "Three lines of numpy."]
      tuning: [1, "Nothing to tune."]
      data_hunger: [1, "Needs no data at all."]
      controllability: [1, "Nothing meaningful to steer."]
      explainability: [1, "There is no reason behind a random pick."]

  most_popular:
    title: MostPopular
    family: Baseline
    rung: 0
    year: null
    paper: null
    code: null
    fidelity: faithful
    summary: Recommends the items with the most interactions in the last few weeks to everyone.
    rubric:
      implementation: [1, "A count and a sort."]
      tuning: [1, "One knob: the recency window (28 days by default)."]
      data_hunger: [1, "Works from the first day of traffic."]
      controllability: [4, "Easy to filter or boost; the list is fully transparent."]
      explainability: [3, "Honest reason ('popular now'), but not personal."]

  itemknn:
    title: ItemKNN
    family: Neighbourhood collaborative filtering
    rung: 1
    year: 2001
    paper: {title: "Item-based Collaborative Filtering Recommendation Algorithms", venue: "WWW 2001", url: "https://dl.acm.org/doi/10.1145/371920.372071"}
    code: null
    fidelity: faithful
    summary: Recommends items that co-occur with what the user already interacted with (cosine similarity between item columns).
    rubric:
      implementation: [2, "A sparse matrix product plus top-k pruning."]
      tuning: [2, "Number of neighbours and a shrinkage term."]
      data_hunger: [2, "Needs enough co-occurrences per item; fine on small data."]
      controllability: [4, "Similarity lists can be inspected and edited directly."]
      explainability: [5, "Exact: 'because you interacted with X and Y'."]

  ease:
    title: EASE^R
    family: Linear autoencoder (item-item)
    rung: 1
    year: 2019
    paper: {title: "Embarrassingly Shallow Autoencoders for Sparse Data", venue: "WWW 2019", url: "https://arxiv.org/abs/1905.03375"}
    code: "https://github.com/hasteck/EASE_WWW19"
    fidelity: faithful
    summary: Learns one item-to-item weight matrix in closed form (a single matrix inverse). Often the strongest simple baseline.
    rubric:
      implementation: [2, "About 20 lines, but the item x item matrix must fit in memory (catalog cap)."]
      tuning: [1, "One hyperparameter, lambda."]
      data_hunger: [2, "Works on small data; memory, not data, is the limit."]
      controllability: [4, "Weights are an inspectable item x item table."]
      explainability: [5, "Exact additive contributions of history items."]

  bpr_mf:
    title: BPR-MF
    family: Matrix factorisation (pairwise loss)
    rung: 2
    year: 2009
    paper: {title: "BPR: Bayesian Personalized Ranking from Implicit Feedback", venue: "UAI 2009", url: "https://arxiv.org/abs/1205.2618"}
    code: "https://github.com/benfred/implicit"
    fidelity: faithful
    summary: Learns user and item vectors so that items a user interacted with score higher than random items.
    rubric:
      implementation: [2, "One library call (implicit)."]
      tuning: [3, "Factors, learning rate, regularisation, iterations."]
      data_hunger: [3, "Needs several interactions per user and item."]
      controllability: [2, "Latent factors are hard to steer directly."]
      explainability: [2, "Post-hoc only: similar items in the latent space."]

  ials:
    title: iALS
    family: Matrix factorisation (weighted least squares)
    rung: 2
    year: 2008
    paper: {title: "Collaborative Filtering for Implicit Feedback Datasets", venue: "ICDM 2008", url: "http://yifanhu.net/PUB/cf.pdf"}
    code: "https://github.com/benfred/implicit"
    fidelity: faithful
    summary: Treats every user-item pair as 'interacted or not' with a confidence weight and solves for vectors by alternating least squares.
    rubric:
      implementation: [2, "One library call (implicit)."]
      tuning: [3, "Factors, regularisation, confidence alpha, iterations."]
      data_hunger: [3, "Needs several interactions per user and item."]
      controllability: [2, "Latent factors are hard to steer directly."]
      explainability: [2, "Post-hoc only: similar items in the latent space."]

  lightgcn:
    title: LightGCN
    family: Graph collaborative filtering
    rung: 3
    year: 2020
    paper: {title: "LightGCN: Simplifying and Powering Graph Convolution Network for Recommendation", venue: "SIGIR 2020", url: "https://arxiv.org/abs/2002.02126"}
    code: "https://github.com/Coder-Yu/SELFRec"
    fidelity: faithful
    summary: Smooths user and item embeddings over the user-item graph (neighbours of neighbours) and trains with BPR.
    rubric:
      implementation: [3, "Graph construction plus a training loop (SELFRec encoder)."]
      tuning: [3, "Layers, embedding size, regularisation, steps."]
      data_hunger: [3, "Benefits from a dense enough graph."]
      controllability: [2, "Embeddings are hard to steer directly."]
      explainability: [2, "Post-hoc: similar items in the embedding space."]

  xsimgcl:
    title: XSimGCL
    family: Graph contrastive learning
    rung: 3
    year: 2023
    paper: {title: "XSimGCL: Towards Extremely Simple Graph Contrastive Learning for Recommendation", venue: "IEEE TKDE 2023", url: "https://arxiv.org/abs/2209.02544"}
    code: "https://github.com/Coder-Yu/SELFRec"
    fidelity: faithful
    summary: LightGCN plus a contrastive loss between two noise-perturbed views, which spreads embeddings more evenly (less popularity bias).
    rubric:
      implementation: [3, "Graph encoder plus a contrastive loss (SELFRec encoder)."]
      tuning: [4, "Noise eps, contrastive weight lambda, temperature tau, contrast layer, plus graph settings."]
      data_hunger: [3, "Benefits from a dense enough graph; needs enough steps to converge."]
      controllability: [2, "Embeddings are hard to steer directly."]
      explainability: [2, "Post-hoc: similar items in the embedding space."]

  sasrec:
    title: SASRec
    family: Sequential (causal self-attention)
    rung: 4
    year: 2018
    paper: {title: "Self-Attentive Sequential Recommendation", venue: "ICDM 2018", url: "https://arxiv.org/abs/1808.09781"}
    code: "https://github.com/kang205/SASRec"
    fidelity: faithful
    summary: A small Transformer reads the user's recent items in order and predicts the next one. Trained here with full cross-entropy, the stronger modern recipe.
    rubric:
      implementation: [3, "A Transformer plus a sequence sampler (in-repo, ~100 lines)."]
      tuning: [3, "Layers, heads, dimension, dropout, sequence length, steps."]
      data_hunger: [4, "Needs many ordered sequences to learn transitions."]
      controllability: [2, "Hard to steer without post-filtering."]
      explainability: [2, "Post-hoc: history items similar to the recommendation."]

  bert4rec:
    title: BERT4Rec
    family: Sequential (bidirectional masked modelling)
    rung: 4
    year: 2019
    paper: {title: "BERT4Rec: Sequential Recommendation with Bidirectional Encoder Representations from Transformer", venue: "CIKM 2019", url: "https://arxiv.org/abs/1904.06690"}
    code: "https://github.com/RUCAIBox/RecBole"
    fidelity: faithful
    summary: Like BERT for text, it hides random items in the sequence and learns to fill them in; at inference it fills in a [mask] placed after the last item.
    rubric:
      implementation: [3, "RecBole model plus an id-mapping adapter."]
      tuning: [4, "Mask ratio, layers, heads, dropout, length; known to need long training."]
      data_hunger: [4, "Needs many ordered sequences."]
      controllability: [2, "Hard to steer without post-filtering."]
      explainability: [2, "Post-hoc: history items similar to the recommendation."]

  s3rec:
    title: S3-Rec
    family: Sequential (self-supervised pre-training)
    rung: 4
    year: 2020
    paper: {title: "S3-Rec: Self-Supervised Learning for Sequential Recommendation with Mutual Information Maximization", venue: "CIKM 2020", url: "https://arxiv.org/abs/2008.07873"}
    code: "https://github.com/RUCAIBox/RecBole"
    fidelity: faithful
    summary: Pre-trains a sequence encoder with four self-supervised tasks that tie items to their attributes, then fine-tunes it for next-item prediction.
    rubric:
      implementation: [4, "Two training stages and item attributes through RecBole."]
      tuning: [4, "Four auxiliary loss weights plus Transformer settings and a stage split."]
      data_hunger: [4, "Needs sequences and meaningful item attributes."]
      controllability: [2, "Hard to steer without post-filtering."]
      explainability: [2, "Post-hoc: history items similar to the recommendation."]

  hstu:
    title: HSTU
    family: Generative sequential transducer
    rung: 4
    year: 2024
    paper: {title: "Actions Speak Louder than Words: Trillion-Parameter Sequential Transducers for Generative Recommendations", venue: "ICML 2024", url: "https://arxiv.org/abs/2402.17152"}
    code: "https://github.com/meta-recsys/generative-recommenders"
    fidelity: simplified
    summary: Meta's sequence architecture with pointwise (SiLU) attention, a gating vector U, and learned position/time-gap biases. Small single-GPU version here.
    rubric:
      implementation: [4, "Custom attention, relative position and time biases (in-repo, verified against Meta's op)."]
      tuning: [4, "Layers, dimension, sequence length, time buckets, steps; designed for huge data."]
      data_hunger: [5, "Shines at very large scale; small data under-uses it."]
      controllability: [2, "Hard to steer without post-filtering."]
      explainability: [2, "Post-hoc: history items similar to the recommendation."]

  tiger_lite:
    title: TIGER-lite
    family: Generative retrieval (semantic IDs), simplified
    rung: 4
    year: 2023
    paper: {title: "Recommender Systems with Generative Retrieval", venue: "NeurIPS 2023", url: "https://arxiv.org/abs/2305.05065"}
    code: null
    fidelity: simplified
    summary: Experimental and unranked. A GRU next-item model plus TIGER-style residual-quantised semantic IDs, used only for explanations; it does not generate IDs like real TIGER.
    rubric:
      implementation: [4, "Sequence model plus a residual codebook."]
      tuning: [4, "Codebook levels and size, loss weight, GRU settings."]
      data_hunger: [4, "Needs many sequences."]
      controllability: [2, "Hard to steer without post-filtering."]
      explainability: [3, "Shared semantic-ID prefixes give a coarse 'same family of items' reason."]

  din:
    title: DIN
    family: CTR ranker with target attention
    rung: 5
    year: 2018
    paper: {title: "Deep Interest Network for Click-Through Rate Prediction", venue: "KDD 2018", url: "https://arxiv.org/abs/1706.06978"}
    code: "https://github.com/RUCAIBox/RecBole"
    fidelity: faithful
    summary: For each candidate item, attends over the user's history to build a candidate-specific interest vector, then predicts click probability.
    rubric:
      implementation: [3, "RecBole model plus pairwise scoring over the catalog."]
      tuning: [3, "Embedding size, MLP sizes, negatives per positive."]
      data_hunger: [4, "Needs many labelled (user, item, outcome) examples."]
      controllability: [3, "Business features can be added as inputs."]
      explainability: [3, "Attention weights over history are a natural reason (not yet exposed by recbench)."]

  dcnv2:
    title: DCN-V2
    family: CTR ranker with feature crosses
    rung: 5
    year: 2021
    paper: {title: "DCN V2: Improved Deep & Cross Network and Practical Lessons for Web-scale Learning to Rank Systems", venue: "WWW 2021", url: "https://arxiv.org/abs/2008.13535"}
    code: "https://github.com/reczoo/FuxiCTR"
    fidelity: faithful
    summary: Combines a cross network (explicit feature interactions) with a deep MLP over user id, item id, and category features; outputs a click probability.
    rubric:
      implementation: [3, "Feature pipeline plus a pairwise scorer over the catalog."]
      tuning: [3, "Cross layers, MLP sizes, negatives, regularisation."]
      data_hunger: [4, "Needs many labelled examples; shines with rich features."]
      controllability: [3, "Business features can be added as inputs."]
      explainability: [2, "Post-hoc: similar items in the id-embedding space."]

  text_hash_tower:
    title: Text hash tower
    family: Content-based two-tower (stand-in for LLM text encoders)
    rung: 6
    year: null
    paper: null
    code: null
    fidelity: simplified
    summary: Builds item vectors from item text and categories (hashed words), so brand-new items can be recommended. A tiny stand-in for LLM-based text understanding.
    rubric:
      implementation: [2, "Hashing plus two small linear towers."]
      tuning: [2, "Hash size, dimension, steps."]
      data_hunger: [2, "Content carries signal even for rare items."]
      controllability: [3, "Content features can be filtered and weighted."]
      explainability: [3, "Cites history items with similar content vectors."]

  multimodal_tower:
    title: Multimodal tower
    family: Content-based two-tower with images
    rung: 6
    year: null
    paper: null
    code: null
    fidelity: simplified
    summary: Text features plus simple colour features from real item images and an item-id residual. Runs only when images are on disk (H&M with the image archive).
    rubric:
      implementation: [3, "Image loading plus a two-tower model."]
      tuning: [3, "Hash size, dimension, image features, steps."]
      data_hunger: [3, "Needs images; benefits from many interactions for the id residual."]
      controllability: [3, "Content features can be filtered and weighted."]
      explainability: [3, "Cites history items with similar content vectors."]

  recombee:
    title: Recombee
    family: Managed recommendation service (SaaS)
    rung: 7
    year: null
    paper: null
    code: "https://github.com/recombee/python-api-client"
    fidelity: faithful
    summary: A hosted recommendation API. recbench uploads the pre-test interactions to a dedicated database and asks it for top-K lists for eval users.
    rubric:
      implementation: [2, "SDK calls for upload and recommendation requests."]
      tuning: [1, "Managed; scenario settings in the admin UI."]
      data_hunger: [2, "Has built-in fallbacks for sparse data."]
      controllability: [4, "Filters and boosters in its query language (ReQL)."]
      explainability: [1, "Black box: no reasons returned."]

# Services documented in the dictionary but not benchmarked live (budget, access, or retirement).
  rp3beta:
    title: RP3beta
    family: Graph random walk (item-item)
    rung: 1
    year: 2016
    paper: {title: "Updatable, Accurate, Diverse, and Scalable Recommendations for Interactive Applications", venue: "ACM TiiS 2016", url: "https://doi.org/10.1145/2955101"}
    code: "https://github.com/MaurizioFD/RecSys2019_DeepLearning_Evaluation"
    fidelity: faithful
    summary: Item-to-item scores from two-step random walks (item, user, item), divided by popularity to the power beta. A strong, cheap baseline.
    rubric:
      implementation: [2, "Two sparse matrix products and a top-k per item; about 40 lines."]
      tuning: [2, "alpha, beta, and the number of neighbours."]
      data_hunger: [2, "Works on sparse data; needs items that co-occur."]
      controllability: [4, "Inspectable item-item weights; beta directly turns popularity down."]
      explainability: [5, "Exact additive contributions of history items."]

  puresvd:
    title: PureSVD
    family: Matrix factorisation (truncated SVD)
    rung: 2
    year: 2010
    paper: {title: "Performance of Recommender Algorithms on Top-N Recommendation Tasks", venue: "RecSys 2010", url: "https://doi.org/10.1145/1864708.1864721"}
    code: null
    fidelity: faithful
    summary: Projects a user's history onto the top-k singular vectors of the interaction matrix. The simplest learned-factor model.
    rubric:
      implementation: [1, "One randomized SVD call."]
      tuning: [1, "One setting: the number of factors."]
      data_hunger: [2, "Works on small data; too few factors collapse to popularity."]
      controllability: [2, "Latent directions are hard to steer."]
      explainability: [2, "Post-hoc only: items close in the factor space."]

  slim:
    title: SLIM (ElasticNet)
    family: Sparse linear model (item-item)
    rung: 1
    year: 2011
    paper: {title: "SLIM: Sparse Linear Methods for Top-N Recommender Systems", venue: "ICDM 2011", url: "https://doi.org/10.1109/ICDM.2011.134"}
    code: "https://github.com/MaurizioFD/RecSys2019_DeepLearning_Evaluation"
    fidelity: faithful
    summary: One non-negative ElasticNet regression per item learns a sparse item-to-item weight matrix (fsSLIM with neighbour pre-selection).
    rubric:
      implementation: [3, "A regression per item; needs parallelism and neighbour pre-selection to be fast."]
      tuning: [2, "Penalty strength, L1 share, and candidate neighbours."]
      data_hunger: [2, "Works on sparse data."]
      controllability: [4, "Sparse, non-negative, inspectable item-item weights."]
      explainability: [5, "Exact additive contributions of history items."]

  vsknn:
    title: V-SKNN
    family: Session-based nearest neighbours
    rung: 4
    year: 2018
    paper: {title: "Evaluation of Session-based Recommendation Algorithms", venue: "User Modeling and User-Adapted Interaction 2018", url: "https://arxiv.org/abs/1803.09587"}
    code: "https://github.com/rn5l/session-rec"
    fidelity: simplified
    summary: Scores items by the past sessions most similar to the user's latest session, weighting recent clicks more.
    rubric:
      implementation: [2, "Session reconstruction and a sparse neighbour search."]
      tuning: [2, "Neighbours, sample size, and position weighting."]
      data_hunger: [2, "Needs session patterns that repeat across users, not long histories."]
      controllability: [3, "Neighbour sessions can be filtered; the weights are heuristics."]
      explainability: [4, "'Sessions like yours also contained this item.'"]

  sansa:
    title: SANSA
    family: Linear autoencoder (sparse approximate EASE)
    rung: 1
    year: 2023
    paper: {title: "Scalable Approximate NonSymmetric Autoencoder for Collaborative Filtering", venue: "RecSys 2023", url: "https://doi.org/10.1145/3604915.3608827"}
    code: "https://github.com/glami/sansa"
    fidelity: faithful
    summary: EASE's closed form computed with a sparse factorisation and a sparse approximate inverse, so the whole catalog fits.
    rubric:
      implementation: [2, "One library call, but SuiteSparse must be installed."]
      tuning: [2, "lambda and the weight density."]
      data_hunger: [2, "Like EASE: memory, not data, used to be the limit."]
      controllability: [4, "Sparse item-item weights (stored as two factors)."]
      explainability: [4, "Additive in the history, but the weights are a product of two sparse factors."]

  gfcf:
    title: GF-CF
    family: Graph filter (training-free)
    rung: 3
    year: 2021
    paper: {title: "How Powerful is Graph Convolution for Recommendation?", venue: "CIKM 2021", url: "https://arxiv.org/abs/2108.07567"}
    code: "https://github.com/yshenaw/GF_CF"
    fidelity: faithful
    summary: Smooths a user's history over the normalised item-item graph and adds a low-rank "ideal low-pass" part. No training.
    rubric:
      implementation: [2, "A sparse product and a truncated SVD; about 30 lines."]
      tuning: [1, "Two settings: alpha and the number of singular vectors."]
      data_hunger: [2, "Works on sparse data; needs co-occurring items."]
      controllability: [3, "Fixed formulas, but the low-rank part is not item-by-item."]
      explainability: [3, "The linear part is an item-item sum; the low-rank part is abstract."]

  turbocf:
    title: Turbo-CF
    family: Graph filter (training-free, polynomial)
    rung: 3
    year: 2024
    paper: {title: "Turbo-CF: Matrix Decomposition-Free Graph Filtering for Fast Recommendation", venue: "SIGIR 2024", url: "https://arxiv.org/abs/2404.14243"}
    code: "https://github.com/jindeok/Turbo-CF"
    fidelity: faithful
    summary: Applies a small polynomial filter to the dense normalised item-item graph; only matrix products, so it is fast on a GPU.
    rubric:
      implementation: [2, "A normalisation and a few dense matrix products."]
      tuning: [2, "Normalisation, power, and the choice of filter."]
      data_hunger: [2, "Works on sparse data; the item cap is set by memory."]
      controllability: [3, "Interpretable filter shape, but no item-level weights to edit."]
      explainability: [3, "Scores are item-item sums through a filtered graph, but the filter mixes many paths."]

  simplex:
    title: SimpleX
    family: Matrix factorisation (cosine contrastive loss)
    rung: 2
    year: 2021
    paper: {title: "SimpleX: A Simple and Strong Baseline for Collaborative Filtering", venue: "CIKM 2021", url: "https://arxiv.org/abs/2109.12613"}
    code: "https://github.com/reczoo/RecZoo"
    fidelity: faithful
    summary: MF with cosine similarity, many negatives with a margin (CCL loss), and user vectors that mix in the average of the history.
    rubric:
      implementation: [2, "An embedding model, a history average, and a margin loss; about 60 lines."]
      tuning: [4, "Negatives, margin, negative weight, gamma, and the usual learning settings interact."]
      data_hunger: [3, "Learns embeddings, so it needs several interactions per item."]
      controllability: [2, "Latent vectors; little to steer directly."]
      explainability: [2, "Post-hoc only: history items close in the embedding space."]

  directau:
    title: DirectAU
    family: Matrix factorisation (alignment and uniformity)
    rung: 2
    year: 2022
    paper: {title: "Towards Representation Alignment and Uniformity in Collaborative Filtering", venue: "KDD 2022", url: "https://arxiv.org/abs/2206.12811"}
    code: "https://github.com/THUwangcy/DirectAU"
    fidelity: faithful
    summary: MF trained to align users with their items and to spread embeddings evenly over the sphere; no negative sampling.
    rubric:
      implementation: [2, "Two short loss functions on top of an embedding model."]
      tuning: [2, "gamma matters most; weight decay and batch size second."]
      data_hunger: [3, "Learns embeddings, so it needs several interactions per item."]
      controllability: [2, "Latent vectors; little to steer directly."]
      explainability: [2, "Post-hoc only: history items close in the embedding space."]

  ultragcn:
    title: UltraGCN
    family: Graph-weighted matrix factorisation
    rung: 3
    year: 2021
    paper: {title: "UltraGCN: Ultra Simplification of Graph Convolutional Networks for Recommendation", venue: "CIKM 2021", url: "https://arxiv.org/abs/2110.15114"}
    code: "https://github.com/reczoo/RecZoo"
    fidelity: faithful
    summary: MF whose loss weights encode what infinitely many graph-convolution layers converge to, plus an item-item neighbour term; no message passing.
    rubric:
      implementation: [3, "Degree weights, an item-neighbour table, and a three-part loss."]
      tuning: [5, "w1-w4, negatives, negative weight, gamma, lambda, and the learning settings; sensitive to them."]
      data_hunger: [3, "Learns embeddings; the graph weights help sparse users a little."]
      controllability: [2, "Latent vectors; little to steer directly."]
      explainability: [2, "Post-hoc only: history items close in the embedding space."]

  multvae:
    title: MultVAE
    family: Variational autoencoder
    rung: 2
    year: 2018
    paper: {title: "Variational Autoencoders for Collaborative Filtering", venue: "WWW 2018", url: "https://arxiv.org/abs/1802.05814"}
    code: "https://github.com/dawenl/vae_cf"
    fidelity: faithful
    summary: Encodes a user's whole history into a small random code and decodes a softmax over all items (multinomial likelihood, KL annealing).
    rubric:
      implementation: [3, "A small encoder-decoder network plus KL annealing."]
      tuning: [3, "Layer sizes, dropout, KL cap, annealing, learning rate."]
      data_hunger: [3, "Strongest on dense histories; weaker for users with very few items."]
      controllability: [2, "Latent codes; little to steer directly."]
      explainability: [2, "Post-hoc only."]

  recvae:
    title: RecVAE
    family: Variational autoencoder
    rung: 2
    year: 2020
    paper: {title: "RecVAE: a New Variational Autoencoder for Top-N Recommendations with Implicit Feedback", venue: "WSDM 2020", url: "https://arxiv.org/abs/1912.11160"}
    code: "https://github.com/ilya-shenbin/RecVAE"
    fidelity: faithful
    summary: MultVAE with a deeper dense-residual encoder, a composite prior, a KL weight scaled by user activity, and alternating encoder and decoder updates.
    rubric:
      implementation: [3, "A deeper encoder, a mixture prior, and two alternating optimisers."]
      tuning: [3, "gamma, layer sizes, dropout, learning rate."]
      data_hunger: [3, "Strongest on dense histories."]
      controllability: [2, "Latent codes; little to steer directly."]
      explainability: [2, "Post-hoc only."]

  gru4rec:
    title: GRU4Rec
    family: Recurrent neural network (sequential)
    rung: 4
    year: 2016
    paper: {title: "Session-based Recommendations with Recurrent Neural Networks", venue: "ICLR 2016", url: "https://arxiv.org/abs/1511.06939"}
    code: "https://github.com/hidasib/GRU4Rec_PyTorch_Official"
    fidelity: faithful
    summary: A GRU reads the user's clicks in order and scores every item as the next click; the authors' official PyTorch code.
    rubric:
      implementation: [2, "An adapter around the official code; the stepping for scoring is ours."]
      tuning: [4, "Loss, hidden size, batch size, learning rate, momentum, dropouts, sampling."]
      data_hunger: [3, "Needs many sequences; short histories give little to learn from."]
      controllability: [2, "A hidden state; little to steer directly."]
      explainability: [2, "Post-hoc only."]

services:
  amazon_personalize:
    title: Amazon Personalize
    status: "Available (not on AWS's maintenance list as of 2026-10-02)."
    why_not_benchmarked: "Real-time campaigns bill per provisioned hour, which risks the <$50/month budget; requests need AWS SigV4 signing (boto3)."
    url: "https://aws.amazon.com/personalize/"
  vertex_ai_search_commerce:
    title: Vertex AI Search for commerce (AI Commerce Search)
    status: "Available; retail catalogs only."
    why_not_benchmarked: "Requires a product catalog and user-event import plus model training time; prediction is billed per request."
    url: "https://cloud.google.com/retail/docs/overview"
  azure_personalizer:
    title: Azure AI Personalizer
    status: "Retired on 2026-10-01; no new resources since 2023-09-20."
    why_not_benchmarked: "Retired. It was a contextual bandit (choose one action per context), not a collaborative-filtering recommender."
    url: "https://learn.microsoft.com/en-us/azure/ai-services/personalizer/"

datasets:
  movielens-25m:
    title: MovieLens 25M
    domain: Movies
    source: "https://grouplens.org/datasets/movielens/25m/"
    citation: "Harper & Konstan, The MovieLens Datasets: History and Context, ACM TiiS 2015"
    license: "GroupLens usage terms: research use; no redistribution; commercial use needs permission."
    commercial_use: "No (without permission)"
    feedback: "Explicit 0.5-5 star ratings, used as implicit 'watched' events."
    side_info: "Titles, multi-valued genres."
    pitfalls: "Timestamps are when a rating was entered (often in bulk), not when the movie was watched, so sequence order is weak."
  retailrocket:
    title: RetailRocket
    domain: E-commerce
    source: "https://www.kaggle.com/datasets/retailrocket/ecommerce-dataset"
    citation: "Retailrocket recommender system dataset (Kaggle, 2016)"
    license: "CC BY-NC-SA 4.0"
    commercial_use: "No"
    feedback: "Implicit views, add-to-carts, and transactions."
    side_info: "Category ids only (other properties are hashed)."
    pitfalls: "Most visitors appear once (very sparse, many cold users); bots are not filtered; category values come from a later snapshot."
  hm:
    title: H&M Personalized Fashion Recommendations
    domain: Fashion e-commerce
    source: "https://www.kaggle.com/competitions/h-and-m-personalized-fashion-recommendations"
    citation: "H&M Group, Kaggle competition (2022)"
    license: "Kaggle competition rules: non-commercial and academic use."
    commercial_use: "No"
    feedback: "Implicit purchases (day-level timestamps)."
    side_info: "Article names, descriptions, product types, customer attributes, optional article images (~30 GB)."
    pitfalls: "Timestamps are dates only (many ties); repeat purchases of basics; the test window is the last 7 days."
  lastfm:
    title: Last.fm 1K
    domain: Music
    source: "http://ocelma.net/MusicRecommendationDataset/lastfm-1K.html"
    citation: "Celma, Music Recommendation and Discovery in the Long Tail, Springer 2010"
    license: "Non-commercial use (Last.fm terms); see the dataset page."
    commercial_use: "No"
    feedback: "Implicit listening events (one row per play)."
    side_info: "Artist names only (no genres)."
    pitfalls: "Highly repetitive (many plays of the same artists), so results are reported with and without repeats; only ~1K users with very long histories."
  steam:
    title: Steam
    domain: Video games
    source: "https://cseweb.ucsd.edu/~jmcauley/datasets.html#steam_data"
    citation: "Kang & McAuley, Self-Attentive Sequential Recommendation, ICDM 2018 (data from the McAuley Lab)"
    license: "Provided for research purposes by the McAuley Lab (UCSD)."
    commercial_use: "No"
    feedback: "Implicit: a written review counts as an interaction."
    side_info: "Game titles, tags, genres (games metadata file)."
    pitfalls: "Day-level timestamps; reviews are a biased sample of play; item text must not come from reviews (they can postdate the cutoff)."
