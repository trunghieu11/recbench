# Worked examples used BOTH by the documentation (docs/dictionary/metrics/*.md) and by
# tests/test_metrics.py, so the numbers you read in the docs are checked on every test run.
# ranked: the recommended list, best first. relevant: the items the user actually interacted with.
cases:
  - name: one-relevant-item-at-rank-3
    ranked: [11, 12, 13, 14, 15]
    relevant: [13]
    k: 5
    expected: {hitrate: 1.0, precision: 0.2, recall: 1.0, ndcg: 0.5, map: 0.3333, mrr: 0.3333}
  - name: two-of-three-relevant-found
    ranked: [21, 22, 23, 24, 25]
    relevant: [21, 24, 99]
    k: 5
    # DCG = 1/log2(2) + 1/log2(5) = 1 + 0.4307 = 1.4307
    # IDCG (3 relevant, k=5) = 1 + 1/log2(3) + 1/log2(4) = 1 + 0.6309 + 0.5 = 2.1309
    expected: {hitrate: 1.0, precision: 0.4, recall: 0.6667, ndcg: 0.6714, map: 0.5, mrr: 1.0}
  - name: nothing-relevant-in-the-list
    ranked: [31, 32, 33]
    relevant: [40]
    k: 3
    expected: {hitrate: 0.0, precision: 0.0, recall: 0.0, ndcg: 0.0, map: 0.0, mrr: 0.0}
  - name: more-relevant-items-than-k
    ranked: [1, 2, 3, 4]
    relevant: [1, 2, 3, 4, 5, 6, 7, 8]
    k: 4
    # recall and NDCG divide by min(k, #relevant) = 4, so a perfect list scores 1.0
    expected: {hitrate: 1.0, precision: 1.0, recall: 1.0, ndcg: 1.0, map: 1.0, mrr: 1.0}
