# Experiments for SANSA (lab 5: docs/labs/05-sansa.md). Each experiment starts from the bake-off's search
# space for sansa in configs/tuning/quick.yaml (what the baseline searched) and changes it:
#   params:   settings added to the search, or searched differently (same format as configs/tuning/quick.yaml)
#   remove:   settings no longer searched (the method's default applies)
#   fixed:    settings held at one value
#   trials:   settings to try (default 10, the baseline's budget: keep it, so the comparison stays fair)
#   note:     what you tried and why (shown on the scoreboard)
#   promoted: true once you promote it (docs/handbook/promote.md)
# Run one:    python -m recbench.lab run --method sansa --experiment icf
# Compare:    python -m recbench.compare sansa sansa:icf
experiments:
  baseline: {}   # the bake-off's search space, unchanged (python -m recbench.lab baseline computed it)

  # Level 3, no code needed: the other factoriser, which the sansa package recommends for large catalogs.
  icf:
    note: Incomplete Cholesky (ICF) instead of CHOLMOD
    fixed: {sansa_factorizer: icf}

  # Level 3, after a small code change: leave out very rare items before factorising.
  # min-count:
  #   note: Items with fewer than n interactions are left out of the Gram matrix
  #   params:
  #     sansa_min_count: {type: choice, values: [1, 3, 5, 10]}

  # Level 4, after you write the variant: EDLAE's per-item penalty through extra pseudo-user rows (Steck 2020).
  # edlae:
  #   note: Per-item penalty lambda + p / (1 - p) * G_ii, added as pseudo-user rows
  #   params:
  #     sansa_dropout: {type: float, low: 0.05, high: 0.75}
