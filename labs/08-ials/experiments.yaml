# Experiments for iALS (lab 8: docs/labs/08-ials.md). Each experiment starts from the bake-off's search
# space for ials in configs/tuning/quick.yaml (what the baseline searched) and changes it:
#   params:   settings added to the search, or searched differently (same format as configs/tuning/quick.yaml)
#   remove:   settings no longer searched (the method's default applies)
#   fixed:    settings held at one value
#   trials:   settings to try (default 10, the baseline's budget: keep it, so the comparison stays fair)
#   note:     what you tried and why (shown on the scoreboard)
#   from_baseline: true holds every other setting at that dataset's baseline best, so the 10 trials all go to
#             your new settings (best for testing one idea)
#   promoted: true once you promote it (docs/handbook/promote.md)
# Run one:    python -m recbench.lab run --method ials --experiment no-time-knobs
# Compare:    python -m recbench.compare ials ials:no-time-knobs
experiments:
  baseline: {}   # the bake-off's search space, unchanged (python -m recbench.lab baseline computed it)

  # Level 3, no code needed: how much do the recency settings add?
  no-time-knobs:
    note: Without recency weighting or a training window
    remove: [decay_half_life_days, train_window_days]

  # Level 3, after a small code change: log-scaled confidence (Hu, Koren & Volinsky 2008).
  # log-confidence:
  #   note: c = 1 + alpha * log(1 + r / eps) instead of 1 + alpha * r
  #   from_baseline: true
  #   params:
  #     ials_confidence: {type: choice, values: [log]}
  #     ials_eps: {type: log, low: 0.01, high: 10.0}
  #     ials_alpha: {type: log, low: 0.3, high: 100.0}   # the confidence scale changes: re-tune alpha

  # Level 4, after you write the variant: popularity-aware confidence, inverse-propensity style (after Saito et al. 2020).
  # ips:
  #   note: Confidence of item j scaled by popularity_j^(-gamma)
  #   from_baseline: true
  #   params:
  #     ials_ips_power: {type: float, low: 0.0, high: 1.0}
  #     ials_alpha: {type: log, low: 0.3, high: 100.0}
