# Experiments for V-SKNN (lab 10: docs/labs/10-vsknn.md). Each experiment starts from the bake-off's search
# space for vsknn in configs/tuning/quick.yaml (what the baseline searched) and changes it:
#   params:   settings added to the search, or searched differently (same format as configs/tuning/quick.yaml)
#   remove:   settings no longer searched (the method's default applies)
#   fixed:    settings held at one value
#   trials:   settings to try (default 10, the baseline's budget: keep it, so the comparison stays fair)
#   note:     what you tried and why (shown on the scoreboard)
#   promoted: true once you promote it (docs/handbook/promote.md)
# Run one:    python -m recbench.lab run --method vsknn --experiment no-window
# Compare:    python -m recbench.compare vsknn vsknn:no-window
experiments:
  baseline: {}   # the bake-off's search space, unchanged (python -m recbench.lab baseline computed it)

  # Level 3, no code needed: past sessions from all history, not only a recent window.
  no-window:
    note: Neighbour sessions from the whole history
    remove: [train_window_days]

  # Level 3, after a small code change: the session gap (fixed at 30 minutes today).
  # session-gap:
  #   note: Sessions split at gaps of 10 minutes to 1 day
  #   params:
  #     vsknn_gap_minutes: {type: choice, values: [10, 30, 120, 1440]}

  # Level 4, after you write the variant: STAN's recency decay of neighbour sessions (Garg et al. 2019).
  # stan-recency:
  #   note: Neighbour sessions weighted by exp(-age / lambda)
  #   params:
  #     vsknn_recency_days: {type: log, low: 1.0, high: 365.0}
