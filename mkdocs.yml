# Documentation site. Build:  mkdocs build --strict     Preview:  mkdocs serve
# Uses only Material built-ins and PyMdown extensions, so Zensical (Material's successor,
# which reads mkdocs.yml) can build it after Material for MkDocs reaches end of life (2026-11-05).
site_name: RecBench
site_description: A recommender-systems dictionary, learned by benchmarking 18 methods honestly.
site_author: Hieu Nguyen
copyright: Copyright &copy; 2026 Hieu Nguyen — MIT License
docs_dir: docs
site_dir: site
# Broken links and anchors are only INFO messages by default; make them warnings so --strict fails on them.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - footnotes
  - tables
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true

extra_javascript:
  - javascripts/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js
extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css
  - stylesheets/extra.css

# Fragments written by recbench.dictionary.build / report.build are embedded with snippets,
# not published as pages of their own.
exclude_docs: |
  generated/

