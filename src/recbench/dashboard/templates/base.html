<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    :root { --fg: #1d1d1f; --muted: #6e6e73; --line: #d2d2d7; --bg: #fbfbfd; --accent: #0b6bcb; }
    @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --line: #424245; --bg: #1c1c1e; --accent: #4ea1ff; } }
    body { font: 15px/1.5 -apple-system, system-ui, sans-serif; color: var(--fg); background: var(--bg); margin: 0 auto; max-width: 980px; padding: 1.5rem 16px; }
    h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; margin-top: 2rem; }
    .note { color: var(--muted); font-size: .9rem; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1rem; }
    th, td { border-bottom: 1px solid var(--line); text-align: left; padding: .35rem .5rem; font-variant-numeric: tabular-nums; }
    th { color: var(--muted); font-weight: 600; }
    .tied { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <p class="note">{{ protocol }}</p>
  {% block body %}{% endblock %}
</body>
</html>
