<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Recommendation benchmark</title>
  <style>
    body { font-family: Georgia, serif; margin: 2rem auto; max-width: 960px; line-height: 1.45; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ccc; text-align: left; padding: 0.3rem; }
    .note { color: #444; }
  </style>
</head>
<body>
  <h1>{{ title }}</h1>
  <p class="note">{{ protocol }}</p>
  {% block body %}{% endblock %}
</body>
</html>
